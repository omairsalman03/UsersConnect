# UsersConnect with S3 Image Uploads
# This file contains examples for different S3 providers
# Uncomment the provider you want to use

services:
  app:
    image: omairsalman/usersconnect:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - logs:/app/logs
    environment:
      - NODE_ENV=production
      # Generate secrets with: openssl rand -hex 32
      - ACCESS_TOKEN_SECRET=change-this-to-random-secret-min-32-chars
      - REFRESH_TOKEN_SECRET=change-this-to-random-secret-min-32-chars
      - DATABASE_HOST=mysql
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=yourpassword
      - DATABASE_NAME=usersconnect
      - REDIS_HOST=redis
      - REDIS_PASSWORD=

      # ===========================================
      # CORS (optional — for a separate Angular/React frontend)
      # Uncomment and set when the API is consumed by a separate frontend.
      # ===========================================
      # - CORS_ENABLED=true
      # - CORS_ALLOWED_ORIGINS=http://localhost:4200,https://app.example.com
      # - CORS_ALLOW_CREDENTIALS=true
      # - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      # - CORS_ALLOWED_HEADERS=Content-Type,Authorization,Accept

      # ===========================================
      # S3 CONFIGURATION - Choose One Provider
      # (The MinIO option was removed: MinIO's images can
      #  no longer be pulled from Docker Hub or quay.io.)
      # ===========================================

      # OPTION 1: AWS S3 (Cloud)
      # Uncomment these 4 lines for AWS S3:
      # - S3_ACCESS_KEY=AKIA...
      # - S3_SECRET_KEY=wJal...
      # - S3_BUCKET_NAME=usersconnect-media
      # - S3_REGION=us-east-1
      
      # OPTION 2: DigitalOcean Spaces
      # Uncomment these 5 lines for DigitalOcean Spaces:
      # - S3_ACCESS_KEY=your-do-spaces-key
      # - S3_SECRET_KEY=your-do-spaces-secret
      # - S3_BUCKET_NAME=usersconnect-media
      # - S3_REGION=nyc3
      # - S3_ENDPOINT=https://nyc3.digitaloceanspaces.com

      # OPTION 3: Cloudflare R2
      # Uncomment these 5 lines for Cloudflare R2:
      # - S3_ACCESS_KEY=your-r2-access-key
      # - S3_SECRET_KEY=your-r2-secret-key
      # - S3_BUCKET_NAME=usersconnect-media
      # - S3_REGION=auto
      # - S3_ENDPOINT=https://your-account-id.r2.cloudflarestorage.com

    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=yourpassword
      - MYSQL_DATABASE=usersconnect
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  logs:

# ===========================================
# USAGE INSTRUCTIONS
# ===========================================
#
# 1. Choose ONE S3 provider from the options above
# 2. Uncomment the corresponding environment variables
# 3. Replace placeholder values with your actual credentials
# 4. Generate JWT secrets: openssl rand -hex 32
# 5. Run: docker-compose -f docker-compose-s3.yml up -d
#
# ===========================================
# PROVIDER COMPARISON
# ===========================================
#
# AWS S3:
#   - Most popular, reliable
#   - Free tier: 5GB storage, 20k GET, 2k PUT
#   - After free tier: ~$0.023/GB/month
#   - Setup: Create bucket + IAM user (see GitHub README)
#
# DigitalOcean Spaces:
#   - $5/month for 250GB
#   - Simple pricing
#   - S3-compatible
#
# Cloudflare R2:
#   - No egress fees
#   - $0.015/GB/month
#   - S3-compatible
#
# ===========================================
